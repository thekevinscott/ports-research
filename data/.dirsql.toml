# SQL over the run data. From the repo root: uvx dirsql --no-ignore -c data/.dirsql.toml "<sql>". See README.md.

[[table]]
name = "runs"
glob = "runs/*/manifest.json"
on-file = "jq -c '{run_id: (input_filename | split(\"/\")[-2]), study, timestamp, completed_at, exit_code, error, harness_commit: .harness.commit} + .condition'"
ddl = """
CREATE TABLE runs (
  run_id TEXT PRIMARY KEY, study TEXT, timestamp TEXT, completed_at TEXT, exit_code INTEGER, error TEXT,
  name TEXT, source_language TEXT, target_language TEXT, model TEXT, effort TEXT,
  include_unit_tests INTEGER, include_source_integration_tests INTEGER, include_target_integration_tests INTEGER,
  include_python_tests INTEGER, include_typescript_tests INTEGER,
  harness_commit TEXT
)
"""

[[table]]
name = "results"
glob = "runs/*/result.json"
on-file = "jq -c '{run_id: (input_filename | split(\"/\")[-2]), is_error, terminal_reason, stop_reason, num_turns, duration_ms, result_index} + (.usage | {input_tokens, output_tokens, cache_creation_input_tokens, cache_read_input_tokens})'"
ddl = """
CREATE TABLE results (
  run_id TEXT, is_error INTEGER, terminal_reason TEXT, stop_reason TEXT, num_turns INTEGER, duration_ms INTEGER, result_index INTEGER,
  input_tokens INTEGER, output_tokens INTEGER, cache_creation_input_tokens INTEGER, cache_read_input_tokens INTEGER
)
"""

[[table]]
name = "matrix"
glob = "runs/matrix-*.jsonl"
on-file = "jq -c '{log: (input_filename | split(\"/\")[-1]), run_id: (.run_directory | if . then split(\"/\")[-1] else null end), round, exit_code, error, wall_seconds, started_at, finished_at} + .cell'"
ddl = """
CREATE TABLE matrix (
  log TEXT, run_id TEXT, round INTEGER, exit_code INTEGER, error TEXT, wall_seconds REAL, started_at TEXT, finished_at TEXT,
  source_language TEXT, model TEXT, effort TEXT,
  include_unit_tests INTEGER, include_source_integration_tests INTEGER, include_target_integration_tests INTEGER
)
"""
