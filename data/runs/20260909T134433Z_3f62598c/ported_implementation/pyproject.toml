[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gbnf"
version = "0.1.41"
description = "A library for parsing GBNF grammars"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ambient Labs" }]
keywords = ["gbnf", "grammar", "grammar-parser"]
dependencies = []

[tool.setuptools.packages.find]
include = ["gbnf*"]
