[project]
name = "template-viewer"
version = "0.1.0"
description = "Render a Claude session transcript (.jsonl) as a self-contained, nicely formatted HTML page"
readme = "README.md"
authors = [
    { name = "Kevin Scott", email = "151596+thekevinscott@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
]

[project.scripts]
template-viewer = "template_viewer.cli:cli"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-describe>=3.2.0",
]
