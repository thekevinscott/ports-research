[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gbnf"
version = "0.1.41"
description = "A library for parsing GBNF grammars"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Ambient Labs" }]
keywords = ["gbnf", "grammar", "grammar-parser"]

[project.urls]
Repository = "https://github.com/ambient-labs/GBNF"

[tool.hatch.build.targets.wheel]
packages = ["gbnf"]
