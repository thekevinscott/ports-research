[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gbnf"
version = "0.1.41"
description = "A library for parsing GBNF grammars"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Ambient Labs" }]
keywords = ["gbnf", "grammar", "grammar-parser"]

[tool.setuptools.packages.find]
include = ["gbnf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
