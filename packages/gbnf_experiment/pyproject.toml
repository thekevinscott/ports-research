[project]
name = "gbnf_experiment"
version = "0.1.0"
description = "The GBNF porting experiment: prepare a reference corpus, port it in a sandbox, grade the port by test pass rate"
readme = "README.md"
authors = [
    { name = "Kevin Scott", email = "151596+thekevinscott@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "botbox>=0.0.8",
    "click>=8.5.0",
    "port_codebase",
    "prompt",
    "pydantic-settings>=2.15.0",
    "python-on-whales>=0.81.0",
]

[project.scripts]
run_gbnf_experiment = "gbnf_experiment.cli:cli"

[build-system]
requires = ["uv_build>=0.9,<1.0"]
build-backend = "uv_build"

[tool.uv.sources]
port_codebase = { path = "../port_codebase", editable = true }
prompt = { path = "../prompt", editable = true }

[dependency-groups]
dev = [
    "coverage>=7.16.0",
    "pytest>=9.1.1",
    "pytest-describe>=3.2.0",
    "ruff>=0.17.0",
]

[tool.ruff.lint]
select = ["TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
