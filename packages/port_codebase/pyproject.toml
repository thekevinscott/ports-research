[project]
name = "port_codebase"
version = "0.1.0"
description = "Ports a reference library into another language, inside a botbox"
readme = "README.md"
authors = [
    { name = "Kevin Scott", email = "151596+thekevinscott@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "botbox>=0.0.4",
    "pathspec>=1.1.1",
    "prompt",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
prompt = { path = "../prompt", editable = true }

[tool.uv.build-backend]
# Colocated tests are development code; keep them out of the wheel and sdist.
source-exclude = ["*_test.py", "**/*_test.py"]

[dependency-groups]
dev = [
    "coverage>=7.16.0",
    "pytest>=9.1.1",
    "pytest-describe>=3.2.0",
]
