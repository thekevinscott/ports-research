[[python.exempt]]
path = "tests/integration/conftest.py"
rules = ["no-first-party-patch", "no-constant-patch"]
reason = "docker and docker_cli are the container runtime, patched at their first-party use-site bindings because the module-level import binds them before a test can reach python_on_whales; each agent's host home is read at import time, so overriding it any other way means a required home parameter on the public entry point that every caller has to thread"
