[project]
name = "walkthroughs"
version = "0.1.0"
description = "LLM walkthroughs of one implementation each, through the claude CLI, and a step-by-step comparison of two"
readme = "README.md"
authors = [
    { name = "Kevin Scott", email = "151596+thekevinscott@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "judge",
]

[project.scripts]
walkthroughs = "walkthroughs.cli:cli"

[build-system]
requires = ["uv_build>=0.9,<1.0"]
build-backend = "uv_build"

[tool.uv.sources]
# Editable: judge's clone_reference finds the experiment's patches relative to its own source file.
judge = { path = "../judge", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-describe>=3.2.0",
    "ruff>=0.17.0",
    "testing-conventions>=0.0.104",
]

[tool.ruff.lint]
select = ["TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
