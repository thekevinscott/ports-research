[project]
name = "measure-api"
version = "0.1.0"
description = "Held-out gbnf grammar x input cases stepped through the public API of a reference and a port, and their per-step agreement"
readme = "README.md"
authors = [
    { name = "Kevin Scott", email = "151596+thekevinscott@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "measure-behavior",
]

[project.scripts]
measure-api = "measure_api.cli:cli"

[build-system]
requires = ["uv_build>=0.9,<1.0"]
build-backend = "uv_build"

[tool.uv.sources]
measure-behavior = { path = "../measure-behavior", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-describe>=3.2.0",
    "ruff>=0.17.0",
    "testing-conventions>=0.0.104",
]

[tool.ruff.lint]
select = ["TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
