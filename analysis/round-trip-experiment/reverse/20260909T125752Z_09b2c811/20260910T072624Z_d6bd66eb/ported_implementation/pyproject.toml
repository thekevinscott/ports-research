[project]
name = "gbnf"
version = "0.0.30"
description = "A library for parsing GBNF grammars"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gbnf*"]
