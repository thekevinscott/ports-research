[project]
name = "gbnf"
version = "0.1.0"
description = "A library for parsing .gbnf grammar files in Python."
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gbnf*"]
