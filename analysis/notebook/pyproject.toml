[project]
name = "analysis"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "altair>=6.2.2",
    "cachetta>=0.7.0",
    "dirsql>=0.4.39",
    "gbnf_experiment",
    "marimo>=0.24.0",
    "numpy>=2.5.3",
    "measure-embedding",
    "polars>=1.44.1",
    "pygount>=3.2.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "vl-convert-python>=1.9.0.post1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-describe>=3.2.0",
    "ruff>=0.17.0",
]

[tool.marimo.runtime]
watcher_on_save = "autorun"

[tool.uv.sources]
gbnf_experiment = { path = "../../packages/gbnf_experiment", editable = true }
measure-embedding = { path = "../measure-embedding", editable = true }

[tool.ruff.lint]
select = ["TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
