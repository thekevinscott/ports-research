[project]
name = "measure-transcript"
version = "0.1.0"
description = "Mechanical per-run counts from a port run's transcript: tool calls, what was read, suite runs, own tests, fetch attempts, tokens"
readme = "README.md"
authors = [
    { name = "Kevin Scott", email = "151596+thekevinscott@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
]

[project.scripts]
measure-transcript = "measure_transcript.cli:cli"

[build-system]
requires = ["uv_build>=0.9,<1.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-describe>=3.2.0",
    "ruff>=0.17.0",
    "testing-conventions>=0.0.104",
]

[tool.ruff.lint]
select = ["TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
