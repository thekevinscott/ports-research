[project]
name = "exercise-api"
version = "0.1.0"
description = "Differential cases and timing across a gbnf reference and its ports, through the public API"
readme = "README.md"
authors = [
    { name = "Kevin Scott", email = "151596+thekevinscott@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "hypothesis>=6.150.0",
]

[project.scripts]
exercise-api = "exercise_api.cli:cli"

[build-system]
requires = ["uv_build>=0.9,<1.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-describe>=3.2.0",
    "testing-conventions>=0.0.104",
]
