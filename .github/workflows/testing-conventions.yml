name: Testing Conventions

on: pull_request

permissions:
  contents: read

jobs:
  agent-harness-sandbox:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      source: packages/agent-harness-sandbox/src
      # Work lands here as stacked PRs, so the diff-scoped gates cannot assume
      # the default `origin/main`.
      base: origin/${{ github.base_ref }}

  execute-test-suite:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      source: packages/execute-test-suite/src
      base: origin/${{ github.base_ref }}

  gbnf-experiment:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      source: packages/gbnf-experiment/src
      base: origin/${{ github.base_ref }}

  generate-embedding:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      source: packages/generate-embedding/src
      base: origin/${{ github.base_ref }}

  porting-harness:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      source: packages/porting-harness/src
      base: origin/${{ github.base_ref }}

  harvest:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      source: scripts/harvest/src
      base: origin/${{ github.base_ref }}
