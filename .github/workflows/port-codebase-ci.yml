name: port_codebase CI

# This file is deliberately not a trigger: see AGENTS.md "CI workflows".
# No tests/integration tier; the tier above unit is e2e, which CI never runs.
on:
  pull_request:
    paths:
      - 'packages/port_codebase/**'
      - '!packages/port_codebase/README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/package-ci.yml
    with:
      package: packages/port_codebase
      integration: false
