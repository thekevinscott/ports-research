name: prompt CI

# This file is deliberately not a trigger: see AGENTS.md "CI workflows".
on:
  pull_request:
    paths:
      - 'packages/prompt/**'
      - '!packages/prompt/README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/package-ci.yml
    with:
      package: packages/prompt
      integration: false
