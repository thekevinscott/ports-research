name: porting-harness CI

# This file is deliberately not a trigger: see AGENTS.md "CI workflows".
# No tests/integration tier; the tier above unit is e2e, which CI never runs.
on:
  pull_request:
    paths:
      - 'porting/porting-harness/**'
      - '!porting/porting-harness/README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Run unit tests
        run: just test-unit
        working-directory: porting/porting-harness
