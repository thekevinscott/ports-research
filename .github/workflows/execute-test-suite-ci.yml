name: execute-test-suite CI

# This file is deliberately not a trigger: see AGENTS.md "CI workflows".
# The typescript half of integration shells out to `pnpm dlx vitest`, so this
# lane needs node and pnpm on top of uv.
on:
  pull_request:
    paths:
      - 'analysis/execute-test-suite/**'
      - '!analysis/execute-test-suite/README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Run unit tests
        run: just test-unit
        working-directory: analysis/execute-test-suite

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run integration tests
        run: just test-integration
        working-directory: analysis/execute-test-suite
