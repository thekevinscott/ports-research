name: PR Monitor

# No `branches:` filter: this repo lands work as stacked PRs, so a base is as
# often another stack branch as it is main.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  monitor:
    name: 'CI Gate'
    runs-on: ubuntu-latest
    # The action has no timeout of its own; this is the backstop for a predicted
    # run that never dispatches.
    timeout-minutes: 20
    steps:
      - uses: thekevinscott/pr-monitor@v1
